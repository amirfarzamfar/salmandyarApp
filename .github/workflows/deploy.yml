name: Deploy To VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        required: false
        default: main
      run_migrations:
        description: Run EF Core migrations before restart
        required: false
        default: "true"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy ref
        id: deploy_ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve migration flag
        id: migration_flag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.run_migrations }}" ]; then
            echo "value=${{ github.event.inputs.run_migrations }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            DEPLOY_REF="${{ steps.deploy_ref.outputs.value }}"
            RUN_MIGRATIONS="${{ steps.migration_flag.outputs.value }}"

            cd "$APP_DIR"
            git fetch --all --tags
            git checkout "$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF"

            if [ "$RUN_MIGRATIONS" = "true" ]; then
              docker compose --env-file .env.production --profile tools run --rm migrations
            fi

            docker compose --env-file .env.production up -d --build --remove-orphans
            docker compose --env-file .env.production ps
            docker image prune -f
