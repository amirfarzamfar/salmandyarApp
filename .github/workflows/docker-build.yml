name: Docker Build

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend
      - name: Build Backend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/salmandyar-backend:latest \
            -f backend/src/Salmandyar.API/Dockerfile \
            backend

      - name: Push Backend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/salmandyar-backend:latest

      # Frontend
      - name: Build Frontend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/salmandyar-frontend:latest \
            -f frontend/Dockerfile \
            frontend

      - name: Push Frontend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/salmandyar-frontend:latest
