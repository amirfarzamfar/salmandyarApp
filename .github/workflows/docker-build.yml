name: Docker Build

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}


      - name: Build Backend
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/salmandyar-backend:latest \
            -f backend/src/Salmandyar.API/Dockerfile \
            backend


      - name: Push Backend
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/salmandyar-backend:latest