map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8080;
}

# ============================================================
# ROUTE WHITELIST — Frontend (Next.js) Pages
# ------------------------------------------------------------
# IMPORTANT: Every public Next.js route must be listed here
# if the server uses a regex-based split that sends `location /`
# (catch-all) to the .NET backend instead of Next.js.
# Missing routes (like /health-tests, /guides, /authors) will
# hit the backend [Authorize] policy and return HTTP 401.
#
# Use this exact regex block on the production server if you
# currently use a pattern like:
#   location ~ ^/(services|articles|tools|diseases|cities|login|portal) {
#       proxy_pass http://frontend_upstream;
#   }
#
# REPLACE your old frontend location regex with this one:
#
#   location ~ ^/(services|articles|tools|diseases|cities|guides|authors|login|portal|register|forgot-password|health-tests|health-tests/) {
#       proxy_pass http://frontend_upstream;
#   }
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
    }

    location /notificationHub {
        proxy_pass http://backend_upstream;
    }

    location /serviceHub {
        proxy_pass http://backend_upstream;
    }

    location /uploads/ {
        proxy_pass http://backend_upstream;
    }

    location /swagger/ {
        proxy_pass http://backend_upstream;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
    }

    # Default local-docker behaviour: everything else goes to Next.js.
    # On production with catch-all to .NET, replace this block with the
    # regex location WHITELIST documented at the top of this file.
    location / {
        proxy_pass http://frontend_upstream;
    }
}
